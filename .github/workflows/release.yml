name: Release

# Installer (.exe) : push tag v* OU merge/push sur main (version = pyproject.toml).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build installer and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Skip if installer already on release
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'RL-LiveTracker-Setup.exe'; then
            echo "Installer already attached to ${TAG} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller pillow

      - name: Install Inno Setup
        if: steps.skip.outputs.skip != 'true'
        run: choco install innosetup -y --no-progress

      - name: Build installer
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Pick release notes file
        if: steps.skip.outputs.skip != 'true'
        id: notes
        shell: bash
        run: |
          VER="${{ steps.meta.outputs.tag }}"
          VER="${VER#v}"
          FILE="docs/RELEASE_v${VER}.md"
          if [ -f "$FILE" ]; then
            echo "path=${FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release (release notes file)
        if: steps.skip.outputs.skip != 'true' && steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/RL-LiveTracker-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish GitHub release (generated notes)
        if: steps.skip.outputs.skip != 'true' && steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: dist/RL-LiveTracker-Setup.exe
          fail_on_unmatched_files: true
          make_latest: true
