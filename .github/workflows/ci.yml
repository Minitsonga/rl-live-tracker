name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [dev, staging, main]

jobs:
  quality:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest ruff pre-commit

      - name: Tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests-dev-to-staging:
    name: Unit tests (dev -> staging)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'staging' && github.head_ref == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

  release-gate-staging-to-main:
    name: Release gate (staging -> main)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributables
        run: python -m build

      - name: Validate package smoke import
        run: |
          pip install dist/*.whl
          python -c "import rl_live_tracker; print(rl_live_tracker.__version__)"
