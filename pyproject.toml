[project]
name = "rl-live-tracker"
version = "1.0.0"
description = "RL Live Tracker — Rocket League session + lobby overlays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.5",
  "curl_cffi>=0.7",
  "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "pre-commit>=3",
]

[project.scripts]
rl-live-tracker = "rl_live_tracker.app:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
